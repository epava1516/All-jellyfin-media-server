version: "3.3"

###############################################################################
# Definimos una red interna para los contenedores
###############################################################################
networks:
  internal:
    name: internal-network
    driver: bridge

services:
  ##############################################################################
  # GLUETUN (VPN / WireGuard)
  ##############################################################################
  gluetun:
    container_name: GlueTun-VPN
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    # Expone puertos SOLO si realmente quieres acceso externo a WireGuard
    # o quieres recibir conexiones entrantes en tu cliente torrent.
    # Ajusta según tu necesidad real.
    ports:
      - 51820:51820/udp  # WireGuard
      - 46931:46931/udp  # Puerto forwarding ProtonVPN (ej. para torrent)
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - VPN_ENDPOINT_IP=${ENDPOINT_IP}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDR}
      - VPN_ENDPOINT_PORT=${ENDPOINT_PORT}
      - VPN_DNS_ADDRESS=${DNS_ADDRESS}
      - WIREGUARD_PUBLIC_KEY=${PUBLIC_KEY}
      - WIREGUARD_PRIVATE_KEY=${PRIVATE_KEY}
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - VPN_PORT_FORWARDING_STATUS_FILE=/tmp/gluetun/forwarded_port
      - TZ=${TZ}
      - UPDATER_PERIOD=24h
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/gluetun:/tmp/gluetun
    restart: unless-stopped
    networks:
      - internal

  ##############################################################################
  # QBITTORRENT
  ##############################################################################
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - WEBUI_PORT=8080
      - PUID=0
      - PGID=0
      - TZ=${TZ}
      - DOCKER_MODS=ghcr.io/gabe565/linuxserver-mod-vuetorrent
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/qbittorrent:/config
      - ${COMMON_PATH}/qbittorrent/downloads:/downloads
    restart: unless-stopped
    # No exponemos puertos directamente, va todo por Gluetun.

  ##############################################################################
  # FLARESOLVERR
  ##############################################################################
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_HTML=false
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER}
      - TZ=${TZ}
      - LANG=es_ES
    # No exponemos el 8191 públicamente; se accede via network interno.
    # ports:
    #   - 8191:8191
    restart: unless-stopped
    networks:
      - internal

  ##############################################################################
  # PROWLARR
  ##############################################################################
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}/configs/prowlarr:/config
    # No exponemos el 9696 públicamente.
    # ports:
    #   - 9696:9696
    restart: unless-stopped
    networks:
      - internal

  ##############################################################################
  # JACKETT
  ##############################################################################
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}/configs/jackett:/config
    # No exponemos el 9117 públicamente.
    # ports:
    #   - 9117:9117
    restart: unless-stopped
    networks:
      - internal

  ##############################################################################
  # SONARR
  ##############################################################################
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/sonarr:/config
      - ${COMMON_PATH}/sonarr/tv:/tv
      - ${COMMON_PATH}/qbittorrent/downloads:/downloads
    # No exponemos 8989 públicamente.
    # ports:
    #   - 8989:8989
    restart: unless-stopped
    networks:
      - internal

  ##############################################################################
  # RADARR
  ##############################################################################
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/radarr:/config
      - ${COMMON_PATH}/radarr/movies:/movies
      - ${COMMON_PATH}/qbittorrent/downloads:/downloads
    # No exponemos 7878 públicamente.
    # ports:
    #   - 7878:7878
    restart: unless-stopped
    networks:
      - internal

  ##############################################################################
  # JELLYFIN
  ##############################################################################
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    # Normalmente mapeamos 8096 y 8920 si se accede directamente,
    # pero lo vamos a gestionar por NPM, así que no los exponemos fuera.
    # ports:
    #   - 8096:8096
    #   - 8920:8920
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/jellyfin:/config
      - ${COMMON_PATH}/jellyfin/cache:/cache
      - ${COMMON_PATH}/sonarr/tv:/data/tvshows
      - ${COMMON_PATH}/radarr/movies:/data/movies
      - ${COMMON_PATH}/qbittorrent/downloads:/data/media_downloads
    restart: unless-stopped
    networks:
      - internal

  ##############################################################################
  # JELLYSEERR
  ##############################################################################
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    # No exponemos 5055 públicamente.
    # ports:
    #   - 5055:5055
    volumes:
      - ${COMMON_PATH}/configs/jellyseerr:/app/config
    restart: unless-stopped
    networks:
      - internal

  ##############################################################################
  # PI-HOLE
  ##############################################################################
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    # Necesita exponer 53/tcp y 53/udp para DNS.
    # 67/udp sólo si usarás DHCP (opcional).
    # Si quieres exponer la web GUI directamente, mapear 80:80.
    # Si NO, quítalo y accede vía NPM usando "pihole:80" en la red interna.
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "67:67/udp"    # solo si usas DHCP en Pi-hole
      # - "80:80/tcp"  # descomenta si quieres el panel expuesto directo
    environment:
      - TZ=${TZ}
      # - WEBPASSWORD=${PIHOLE_WEBPASSWORD} # si quieres password
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - internal

  ##############################################################################
  # NGINX PROXY MANAGER (NPM)
  ##############################################################################
  app:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm
    restart: unless-stopped
    ports:
      - '80:80'   # HTTP
      - '443:443' # HTTPS
      - '81:81'   # Panel de NPM
    environment:
      DB_POSTGRES_HOST: ${POSTGRES_HOST}
      DB_POSTGRES_PORT: ${POSTGRES_PORT}
      DB_POSTGRES_USER: ${POSTGRES_USER}
      DB_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRES_NAME: ${POSTGRES_DB}
      # DISABLE_IPV6: 'true' # descomenta si tu host no tiene IPv6
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    depends_on:
      - db
    networks:
      - internal

  ##############################################################################
  # POSTGRES PARA NGINX PROXY MANAGER
  ##############################################################################
  db:
    image: postgres:latest
    container_name: npm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - internal
